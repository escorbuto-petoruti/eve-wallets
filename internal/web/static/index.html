<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>EVE wallets</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="topbar">
    <h1>EVE wallets</h1>
    <div id="user-bar" class="user-bar" hidden>
      <span class="muted">Signed in as <strong id="user-name"></strong></span>
      <span class="muted">Characters: <span id="characters"></span></span>
      <a class="button" href="/auth/add-character">Add character</a>
      <form method="post" action="/auth/logout">
        <button type="submit">Sign out</button>
      </form>
    </div>
  </div>
  <p id="updated" class="muted"></p>
</header>
<main>
  <section id="signed-out" class="card" aria-labelledby="signed-out-title" hidden>
    <h2 id="signed-out-title">Sign in</h2>
    <p id="session-message" class="warn" role="status" aria-live="polite"></p>
    <p>Sign in with your EVE Online character to see its wallets.</p>
    <p><a class="button primary" href="/auth/login">Sign in with EVE Online</a></p>
  </section>

  <div id="signed-in" hidden>
  <section id="collecting" class="card" hidden>
    <h2>Collecting your wallets</h2>
    <p id="collecting-text" role="status" aria-live="polite">Collecting your wallets… this can take a minute.</p>
  </section>

  <section id="empty" class="card" hidden>
    <h2>Cannot load wallets</h2>
    <p id="empty-text" class="bad"></p>
  </section>

  <section id="controls" class="card" hidden>
    <h2>Time range</h2>
    <div id="ranges" role="group" aria-label="Time range">
      <button type="button" data-range="86400">24 h</button>
      <button type="button" data-range="604800">7 d</button>
      <button type="button" data-range="2592000" class="active" aria-pressed="true">30 d</button>
      <button type="button" data-range="0">All</button>
    </div>
  </section>

  <div id="tabs" class="tabs" role="tablist" aria-label="Wallet owners" hidden></div>
  <div id="sections"></div>

  <section id="status-card" class="card">
    <h2>Last collection</h2>
    <div id="status"></div>
  </section>
  </div>
</main>
<script src="/static/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
